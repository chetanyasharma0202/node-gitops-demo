services:
  node-app:
    image: node-gitops-demo:local
    container_name: node-gitops-demo

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      PORT: 3000
      APP_VERSION: local

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
